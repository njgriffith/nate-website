<div class="media-player" cdkDrag cdkDragHandle (cdkDragStarted)="updateZIndex('Media Player')" [style.--base-z-index]="baseZIndex" [style.zIndex]="baseZIndex">
    <audio #player (timeupdate)="updateProgressBar($event)" (ended)="handleMediaEvent('next')"></audio>
    <img class="head" src="assets/head/head.webp">
    <div class="vid-bkgd">
        <video *ngIf="isSongPlaying" autoplay loop [muted]="true" style="width: 100%; height: 100%; object-fit: cover;">
            <source src="assets/music/ms_vis.mp4" type="video/mp4">
        </video>
        <img *ngIf="!isSongPlaying" src="assets/head/vid_bkgd.webp" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    <div class="media-window-controller">
        <img src="assets/head/player_min.webp" (click)="minApp()">
        <img src="assets/head/player_close.webp" (click)="closeApp()">
    </div>
    <div class="media-player-controller">
        <img src="assets/head/player_prev.webp" (click)="handleMediaEvent('prev')" class="media-control">
        <img src="assets/head/player_pause.webp" (click)="handleMediaEvent('pause')" class="media-control">
        <img src="assets/head/player_play.webp" (click)="handleMediaEvent('play')" class="media-control">
        <img src="assets/head/player_next.webp" (click)="handleMediaEvent('next')" class="media-control">
    </div>

    <div class="right-ear-container" [style.left]="rightOffset">
        <img src="assets/head/right_ear.webp" class="right-ear">
        <img class="right-open" [src]="getRightSource()" (mouseenter)="rightHovered = true"
            (mouseleave)="rightHovered = false" (click)="rightOpened = !rightOpened" (click)="toggleEar('r')">
        <img src="assets/head/right_drawer_top.webp" style="position: absolute; left: -172px; top: 0px;">
        <img src="assets/head/right_drawer_bottom.webp" style="position: absolute; left: -172px; top: 150px;">
        <img src="assets/head/right_drawer_left.webp" style="position: absolute; left: -182px; top: 0px;">
        <div class="media-table sunken-panel">
            <table class="interactive">
                <thead>
                    <tr>
                        <th>title</th>
                        <th>artist</th>
                        <th>length</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let song of songs; let i = index" (click)="currentSongIndex=i"
                        (click)="handleMediaEvent('play')" [class.row-highlight]="i===currentSongIndex">
                        <td>{{song[0]}}</td>
                        <td>{{song[1]}}</td>
                        <td>{{song[2]}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="left-ear-container" [style.left]="leftOffset">
        <img src="assets/head/left_ear.webp" class="left-ear">
        <img class="left-open" [src]="getLeftSource()" (mouseenter)="leftHovered = true"
            (mouseleave)="leftHovered = false" (click)="leftOpened = !leftOpened" (click)="toggleEar('l')">
        <img src="assets/head/left_drawer_top.webp" style="position: absolute; left: 84px; top: 0px;">
        <img src="assets/head/left_drawer_bottom.webp" style="position: absolute; left: 84px; top: 150px;">
        <img src="assets/head/left_drawer_right.webp" style="position: absolute; left: 250px; top: 0px;">
        <div class="knob-drawer">
            <img src="assets/head/drawer_bkgrnd_top.webp">
            <div class="player-grid-container">
                <div class="now-playing">Now Playing</div>
                <div class="track-details">
                    <div>{{currentArtist}}</div>
                    <div> - </div>
                    <div>{{currentSong}}</div>
                </div>
                <div class="player-progress" #progressBar>
                    <img src="assets/head/progressbar.webp" class="player-duration-bar">
                    <img src="assets/head/thumb_01_default.webp" class="player-current-time" cdkDrag
                        cdkDragBoundary=".player-progress" (cdkDragStarted)="onDragStart($event)"
                        (cdkDragEnded)="seekTrack($event)" #progressThumb>
                </div>
            </div>
        </div>
    </div>
</div>
