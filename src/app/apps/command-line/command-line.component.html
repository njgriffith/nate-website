<div #cli class="cli-background" tabindex="0" role="textbox" aria-label="admin console"
  (focus)="onFocus()" (blur)="onBlur()" (keydown)="recordInput($event)">

  <div *ngFor="let entry of commandHistoryDisplay" class="previous-command">

    <!-- Prompt inputs don't get a prompt prefix — they're answers, not commands -->
    <ng-container *ngIf="!entry.isPromptInput">
      <span class="current-line">
        &nbsp;{{ user || 'guest' }}&#64;nate-griffith.com&nbsp;>&nbsp;
      </span>
      <span>{{ entry.text }}</span>

      <!-- Response for known commands -->
      <ng-container *ngIf="commandMap[entry.text] as cmd">
        <ng-container *ngIf="cmd.response">
          <div *ngIf="cmd.response.includes('\n'); else singleLine">
            <div *ngFor="let line of cmd.response.split('\n')">
              <ng-container *ngIf="entry.text === 'help'; else plainLine">
                <span class="syntax-highlight">{{ line.split(' - ')[0] }}</span>
                <span>&nbsp;-&nbsp;{{ line.split(' - ')[1] }}</span>
              </ng-container>
              <ng-template #plainLine>{{ line }}</ng-template>
            </div>
          </div>
          <ng-template #singleLine>
            <div>{{ cmd.response }}</div>
          </ng-template>
        </ng-container>
      </ng-container>

      <!-- Unknown command -->
      <div *ngIf="!commandMap[entry.text]">
        command not found: {{ entry.text }}
      </div>
    </ng-container>

    <!-- Prompt inputs: just show the text, no prefix -->
    <ng-container *ngIf="entry.isPromptInput">
      <span>{{ entry.text }}</span>
    </ng-container>

  </div>

  <!-- Active input line -->
  <span class="current-line">
    &nbsp;{{ user || 'guest' }}&#64;nate-griffith.com&nbsp;>&nbsp;
  </span>
  <span *ngIf="isPromptingUser">{{ currentPrompt }}</span>
  <span #cursor></span>
  <span #blink class="hidden">_</span>
</div>
